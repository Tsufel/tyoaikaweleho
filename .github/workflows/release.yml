name: Release

# Push a tag like v1.1.0 to build the installer and publish a GitHub
# release with the .exe and its .sha256 checksum attached. The app's
# auto-updater downloads and verifies these assets.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload assets

jobs:
  build-and-release:
    name: Build installer & publish release
    runs-on: windows-latest   # Inno Setup 6 is preinstalled on this image

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Verify tag matches version.py
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart("v")
          $pyVer = (python -c "from version import __version__; print(__version__)").Trim()
          if ($tagVer -ne $pyVer) {
            Write-Error "Tag v$tagVer does not match version.py ($pyVer) - bump version.py before tagging."
          }
          "VERSION=$pyVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build app bundle (PyInstaller)
        run: pyinstaller --noconfirm Tyoaikaweleho.spec

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $env:WELEHO_DATA_DIR = Join-Path $env:RUNNER_TEMP "weleho-smoke"
          New-Item -ItemType Directory -Force $env:WELEHO_DATA_DIR | Out-Null
          # One retry on timeout: the first launch of a fresh bundle can stall
          # while antivirus scans it
          foreach ($attempt in 1..2) {
            $p = Start-Process "dist\Tyoaikaweleho\Tyoaikaweleho.exe" -ArgumentList "--smoke-test" -PassThru
            $null = $p.Handle   # keeps ExitCode readable after exit
            if ($p.WaitForExit(90000)) { break }
            Stop-Process -Id $p.Id -Force
            if ($attempt -eq 2) { Write-Error "Smoke test timed out" }
            Write-Warning "Smoke test timed out, retrying"
          }
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION installer.iss

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "Output\TyoaikawelehoSetup_$env:VERSION.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "Output/TyoaikawelehoSetup_$env:VERSION.exe" `
            "Output/TyoaikawelehoSetup_$env:VERSION.exe.sha256" `
            --title "Työaikaweleho ${{ github.ref_name }}" `
            --generate-notes
